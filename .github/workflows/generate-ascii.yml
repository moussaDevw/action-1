name: Generate ASCII Art

on: push

jobs:
 ascii_job:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repos
          uses: actions/checkout@v7
        
        - name: Install cowsay
          run: sudo apt-get install -y cowsay

        - name: Execute cowsay
          run: cowsay -f dragon "Run for cover, I'm a dragon!" >> dragon.txt

        - name: Test file existe
          run: grep -i "dragon" dragon.txt

        - name: Read file
          run: cat dragon.txt

        - name: List repo file
          run: ls -ltra